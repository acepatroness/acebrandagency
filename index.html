    <script>
    (function() {
        const canvas = document.createElement('canvas');
        canvas.id = 'universe-canvas';
        canvas.style.position = 'fixed';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.zIndex = '0';
        canvas.style.pointerEvents = 'none';
        document.body.insertBefore(canvas, document.body.firstChild);

        const ctx = canvas.getContext('2d');
        const particles = [];
        const numParticles = 150;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        }
        window.addEventListener('resize', resize);
        
        const mouse = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', function(event) { mouse.x = event.clientX; mouse.y = event.clientY; });
        window.addEventListener('touchmove', function(event) { if(event.touches[0]) { mouse.x = event.touches[0].clientX; mouse.y = event.touches[0].clientY; } }, { passive: true });
        window.addEventListener('mouseout', function() { mouse.x = null; mouse.y = null; });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.baseX = this.x; this.baseY = this.y;
                this.density = (Math.random() * 40) + 5;
                this.color = Math.random() > 0.4 ? '#7701BC' : '#C1BFBF';
                this.spring = 0.01; this.vx = 0; this.vy = 0; this.friction = 0.9;
            }
            update() {
                let dx = this.x - mouse.x; let dy = this.y - mouse.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                if (mouse.x != null && distance < mouse.radius) {
                    let angle = Math.atan2(dy, dx);
                    let force = (mouse.radius - distance) / mouse.radius;
                    this.vx += force * Math.cos(angle) * 0.5; this.vy += force * Math.sin(angle) * 0.5;
                }
                this.vx += (this.baseX - this.x) * this.spring; this.vy += (this.baseY - this.y) * this.spring;
                this.vx *= this.friction; this.vy *= this.friction;
                this.x += this.vx; this.y += this.vy;
            }
            draw() {
                ctx.fillStyle = this.color; ctx.shadowColor = this.color;
                ctx.shadowBlur = this.color === '#7701BC' ? 10 : 5;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        function init() {
            particles.length = 0;
            for (let i = 0; i < numParticles; i++) { particles.push(new Particle()); }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) { particles[i].update(); particles[i].draw(); }
            requestAnimationFrame(animate);
        }
        resize(); animate();
    })();
    </script>

    <script>
    if (!window.isUnifiedAnimationInitialized) {
        (function() {
            const canvas = document.getElementById('global-ash-canvas'); if (!canvas) return;
            const ctx = canvas.getContext('2d');
            function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            resizeCanvas(); window.addEventListener('resize', resizeCanvas);
            let particles = [];
            class AshParticle {
                constructor(x, y) { this.x = x; this.y = y; this.vx = (Math.random() - 0.5) * 0.8; this.vy = -Math.random() * 0.5 - 0.2; this.life = 1; this.decay = 0.008 + Math.random() * 0.012; this.size = Math.random() * 3 + 1; this.color = Math.random() > 0.8 ? '#510FD5' : '#C1BFBF'; }
                update() { this.x += this.vx; this.y += this.vy; this.vx *= 0.98; this.vy += 0.01; this.life -= this.decay; this.size *= 0.998; }
                draw() { ctx.save(); ctx.globalAlpha = this.life * 0.8; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
            }
            function handleMouseMove(e) { for (let i = 0; i < 6; i++) { particles.push(new AshParticle(e.clientX + (Math.random() - 0.5) * 30, e.clientY + (Math.random() - 0.5) * 30)); } }
            function handleTouchMove(e) { if (e.touches[0]) { handleMouseMove({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY }); } }
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles = particles.filter(p => { p.update(); p.draw(); return p.life > 0 && p.size > 0.1; });
                requestAnimationFrame(animate);
            }
            window.addEventListener('mousemove', handleMouseMove, { passive: true });
            window.addEventListener('touchmove', handleTouchMove, { passive: true });
            animate(); window.isUnifiedAnimationInitialized = true;
        })();
    }

    document.addEventListener('contextmenu', e => e.preventDefault(), false);

    document.addEventListener('DOMContentLoaded', () => {
        const enterButtonTextEn = document.querySelector('#enter-btn .lang-en');
        const enterButtonTextRu = document.querySelector('#enter-btn .lang-ru');
        const langEn = document.getElementById('lang-en');
        const langRu = document.getElementById('lang-ru');
        const mainHeadline = document.getElementById('main-headline');
        const subLine1 = document.getElementById('sub-line-1');
        const subLine2 = document.getElementById('sub-line-2');
        const enterLink = document.getElementById('enter-btn');

        const content = {
            en: {
                main: "branding & events",
                sub1: "for the 1% of businesses",
                sub2: "bored with the other 99%",
                button: "recode your dna"
            },
            ru: {
                main: "брендинг & ивенты",
                sub1: "для 1% бизнесов которым",
                sub2: "наскучили остальные 99%",
                button: "переписать днк"
            }
        };
        
        function animateHeadlines() {
            const allTextElements = [mainHeadline, subLine1, subLine2];
            const flashWords = ['1%', 'branding', 'брендинг'];
            let totalCharIndex = 0;
            const initialDelay = 0.8;

            allTextElements.forEach(element => {
                if (!element.textContent.trim()) return;
                const text = element.textContent;
                element.innerHTML = '';
                const words = text.split(' ');
                words.forEach((word, index) => {
                    if (index > 0) {
                        element.appendChild(document.createTextNode(' '));
                    }
                    let isFlashWord = flashWords.some(fw => word.toLowerCase().includes(fw));
                    for (const char of word) {
                        const span = document.createElement('span');
                        span.className = 'char';
                        if (isFlashWord) { span.classList.add('highlight'); }
                        span.style.animationDelay = `${initialDelay + totalCharIndex * 0.04}s`;
                        span.textContent = char;
                        element.appendChild(span);
                        totalCharIndex++;
                    }
                });
            });
        }
        
        function switchLanguage(lang) {
            document.body.dataset.lang = lang;
            document.documentElement.lang = lang;

            const currentContent = content[lang];
            mainHeadline.textContent = currentContent.main;
            subLine1.textContent = currentContent.sub1;
            subLine2.textContent = currentContent.sub2;

            if (lang === 'ru') {
                document.querySelector('meta[name="description"]').setAttribute('content', 'Для 1% бизнесов, которым наскучили остальные 99%. ACE Brand Agency проектирует несправедливые преимущества через премиальный брендинг и эксклюзивные мероприятия в Дубае. Мы сжигаем шаблоны и строим легенды.');
                document.querySelector('meta[name="keywords"]').setAttribute('content', 'премиальное брендинговое агентство Дубай, организация vip мероприятий ОАЭ, маркетинг для HNW в Дубае, брендинг класса люкс, нестандартные ивенты, креативные концепции для бизнеса, архитектура бренда, организация модных показов, продюсирование модных показов, уникальные авторские музыкальные композиции для модных показов и ивентов, музыка для модных показов, авторская музыка для бренда, эксклюзивные мероприятия Дубай, агентство нешаблонных решений, премиум брендинг.');
                enterButtonTextRu.textContent = currentContent.button;
                enterButtonTextEn.textContent = '';
                // === ИСПРАВЛЕННЫЙ ПУТЬ ===
                enterLink.href = '/manifesto/index.html?lang=ru';
            } else {
                document.querySelector('meta[name="description"]').setAttribute('content', 'For the 1% of businesses bored with the other 99%. ACE Brand Agency architects unfair advantages through premium branding and bespoke events in Dubai, UAE. We burn templates and build legends.');
                document.querySelector('meta[name="keywords"]').setAttribute('content', 'premium branding agency Dubai, bespoke events UAE, HNW marketing, luxury brand strategy, disruptive branding, high-end event production, anti-template agency, creative direction Dubai, brand architecture for leaders, organization of fashion shows, production of fashion shows, unique original musical compositions for fashion shows and events, music for fashion shows, original music for a brand, exclusive events UAE, VIP event management Dubai.');
                enterButtonTextEn.textContent = currentContent.button;
                enterButtonTextRu.textContent = '';
                // === ИСПРАВЛЕННЫЙ ПУТЬ ===
                enterLink.href = '/manifesto/index.html?lang=en';
            }
            
            langRu.classList.toggle('active', lang === 'ru');
            langEn.classList.toggle('active', lang === 'en');
            
            animateHeadlines();
        }
        
        langEn.addEventListener('click', () => switchLanguage('en'));
        langRu.addEventListener('click', () => switchLanguage('ru'));

        switchLanguage('en');
    });
    </script>
