    <!-- Анимации -->
    <script> 
        (function(){
            const a=document.createElement("canvas");
            a.id="universe-canvas";
            a.style.position="fixed";
            a.style.top="0";
            a.style.left="0";
            a.style.width="100%";
            a.style.height="100%";
            /* === ИЗМЕНЕНИЕ: Z-INDEX УВЕЛИЧЕН С 0 ДО 2 === */
            a.style.zIndex="2";
            a.style.pointerEvents="none";
            document.body.insertBefore(a,document.body.firstChild);
            const b=a.getContext("2d");
            let c=[];
            function d(){
                a.width=window.innerWidth;
                a.height=window.innerHeight;
                c=[];
                for(let e=0;e<150;e++)c.push(new f)
            }
            window.addEventListener("resize",d);
            const e={x:null,y:null,radius:150};
            window.addEventListener("mousemove",g=>{e.x=g.clientX;e.y=g.clientY});
            window.addEventListener("touchmove",g=>{if(g.touches[0]){e.x=g.touches[0].clientX;e.y=g.touches[0].clientY}},{passive:!0});
            window.addEventListener("mouseout",()=>{e.x=null;e.y=null});
            class f{
                constructor(){this.x=Math.random()*a.width;this.y=Math.random()*a.height;this.baseX=this.x;this.baseY=this.y;this.size=Math.random()*2+.5;this.color=Math.random()>.4?"#7701BC":"#C1BFBF";this.spring=.01;this.vx=0;this.vy=0;this.friction=.9}
                update(){if(e.x!=null){let g=this.x-e.x,h=this.y-e.y,i=Math.sqrt(g*g+h*h);if(i<e.radius){let j=Math.atan2(h,g),k=(e.radius-i)/e.radius;this.vx+=k*Math.cos(j)*.5;this.vy+=k*Math.sin(j)*.5}}this.vx+=(this.baseX-this.x)*this.spring;this.vy+=(this.baseY-this.y)*this.spring;this.vx*=this.friction;this.vy*=this.friction;this.x+=this.vx;this.y+=this.vy}
                draw(){b.fillStyle=this.color;b.shadowColor=this.color;b.shadowBlur=this.color==="#7701BC"?10:5;b.beginPath();b.arc(this.x,this.y,this.size,0,Math.PI*2);b.fill()}
            }
            function h(){b.clearRect(0,0,a.width,a.height);c.forEach(i=>{i.update();i.draw()});requestAnimationFrame(h)}
            d();h()
        })(); 
    </script>

    <script> (function(){const a=document.getElementById("global-ash-canvas");if(!a)return;const b=a.getContext("2d");function c(){a.width=window.innerWidth;a.height=window.innerHeight}c();window.addEventListener("resize",c);let d=[];class e{constructor(h,i){this.x=h;this.y=i;this.vx=(Math.random()-.5)*.8;this.vy=-Math.random()*.5-.2;this.life=1;this.decay=.008+Math.random()*.012;this.size=Math.random()*3+1;this.color=Math.random()>.8?"#510FD5":"#C1BFBF"}update(){this.x+=this.vx;this.y+=this.vy;this.vx*=.98;this.vy+=.01;this.life-=this.decay;this.size*=.998}draw(){b.save();b.globalAlpha=this.life*.8;b.fillStyle=this.color;b.beginPath();b.arc(this.x,this.y,this.size,0,Math.PI*2);b.fill();b.restore()}}function f(h){for(let i=0;i<6;i++)d.push(new e(h.clientX+(Math.random()-.5)*30,h.clientY+(Math.random()-.5)*30))}function g(h){if(h.touches[0])f({clientX:h.touches[0].clientX,clientY:h.touches[0].clientY})}function j(){b.clearRect(0,0,a.width,a.height);d=d.filter(h=>{h.update();h.draw();return h.life>0&&h.size>.1});requestAnimationFrame(j)}window.addEventListener("mousemove",f,{passive:!0});window.addEventListener("touchmove",g,{passive:!0});j()})();document.addEventListener("contextmenu",a=>a.preventDefault(),!1);document.addEventListener("keydown",a=>{if((a.ctrlKey||a.metaKey)&&"caxus".indexOf(a.key)!==-1)a.preventDefault()}); </script>
    
    <!-- Финальный скрипт для языка и скрипт-диверсант для формы -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Код для переключения языка
            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang') === 'ru' ? 'ru' : 'en';
            const ritual = params.get('ritual') || 'not_specified';
            
            document.body.dataset.lang = lang;
            
            document.querySelectorAll('.lang-en, .lang-ru').forEach(el => el.style.display = 'none');
            const activeContent = document.querySelector(`.lang-${lang}`);
            if (activeContent) {
                activeContent.style.display = 'block';
                const ritualInput = activeContent.querySelector('input[name="ritual"]');
                if(ritualInput) {
                    ritualInput.value = ritual;
                }
            }

            // === СКРИПТ-ДИВЕРСАНТ ===
            async function handleFormSubmit(event) {
                event.preventDefault(); // Перехватываем стандартное поведение
                const form = event.target;
                const data = new FormData(form);
                
                try {
                    const response = await fetch(form.action, {
                        method: form.method,
                        body: data,
                        headers: {
                            'Accept': 'application/json' // Важный заголовок!
                        }
                    });

                    if (response.ok) {
                        // УСПЕХ! Делаем редирект сами
                        const nextUrl = form.querySelector('input[name="_next"]').value;
                        window.location.href = nextUrl;
                    } else {
                        // Ошибка сервера
                        const responseData = await response.json();
                        if (Object.hasOwn(responseData, 'errors')) {
                            alert(responseData["errors"].map(error => error["message"]).join(", "));
                        } else {
                            alert('An unknown error occurred.');
                        }
                    }
                } catch (error) {
                    // Ошибка сети
                    alert('Network error. Please try again.');
                }
            }

            // Вешаем наш диверсионный скрипт на обе формы
            const formEn = document.getElementById('form-en');
            const formRu = document.getElementById('form-ru');
            if(formEn) formEn.addEventListener('submit', handleFormSubmit);
            if(formRu) formRu.addEventListener('submit', handleFormSubmit);
        });
    </script>
