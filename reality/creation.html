    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang') || 'en';
            
            document.body.dataset.lang = lang;
            document.querySelectorAll(`.lang-${lang}`).forEach(el => { el.style.display = 'block'; });

            const creationTexts = {
                en: ["contact established", "we see you", "be ready"],
                ru: ["контакт установлен", "мы видим вас", "будьте готовы"]
            };

            const lines = document.querySelectorAll(`.lang-${lang} .creation-text`);
            const texts = creationTexts[lang];
            
            let totalCharIndex = 0;
            const baseDelay = 0.8; 
            const charDelay = 0.05;
            const lineDelay = 0.8;
            
            lines.forEach((line, lineIndex) => {
                const text = texts[lineIndex];
                if (!text) return;
                
                line.innerHTML = '';
                const words = text.split(' ');
                
                words.forEach((word, wordIndex) => {
                    for (const char of word) {
                        const span = document.createElement('span');
                        span.className = 'char highlight';
                        span.style.animationDelay = `${baseDelay + (totalCharIndex * charDelay) + (lineIndex * lineDelay)}s`;
                        span.innerHTML = char;
                        line.appendChild(span);
                        totalCharIndex++;
                    }
                    
                    if (wordIndex < words.length - 1) {
                        const space = document.createElement('span');
                        space.innerHTML = '&nbsp;';
                        line.appendChild(space);
                    }
                });
            });

            document.addEventListener('contextmenu', e => e.preventDefault());
        });

        // === АНИМАЦИЯ ЧАСТИЦ ФОНА ===
        (function() {
            const canvas = document.getElementById('universe-canvas'); 
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let particles = [];
            
            function resize() { 
                canvas.width = window.innerWidth; 
                canvas.height = window.innerHeight; 
                particles = []; 
                for (let i = 0; i < 150; i++) particles.push(new Particle()); 
            }
            window.addEventListener('resize', resize);
            
            const mouse = { x: null, y: null, radius: 150 };
            window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
            // ИЗМЕНЕНИЕ: ДОБАВЛЕНА РЕАКЦИЯ НА КАСАНИЕ (ДЛЯ МОБИЛЬНЫХ)
            window.addEventListener('touchmove', e => { if (e.touches[0]) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; } }, { passive: true });
            window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
            
            class Particle {
                constructor() { 
                    this.x = Math.random() * canvas.width; 
                    this.y = Math.random() * canvas.height; 
                    this.baseX = this.x; this.baseY = this.y; 
                    this.size = Math.random() * 2 + 0.5; 
                    this.color = Math.random() > 0.4 ? '#7701BC' : '#C1BFBF'; 
                    this.spring = 0.01; 
                    this.vx = 0; this.vy = 0; this.friction = 0.9; 
                }
                update() { 
                    if (mouse.x != null) { 
                        let dx = this.x - mouse.x; 
                        let dy = this.y - mouse.y; 
                        let distance = Math.sqrt(dx * dx + dy * dy); 
                        if (distance < mouse.radius) { 
                            let angle = Math.atan2(dy, dx); 
                            let force = (mouse.radius - distance) / mouse.radius; 
                            this.vx += force * Math.cos(angle) * 0.5; 
                            this.vy += force * Math.sin(angle) * 0.5; 
                        } 
                    } 
                    this.vx += (this.baseX - this.x) * this.spring; 
                    this.vy += (this.baseY - this.y) * this.spring; 
                    this.vx *= this.friction; this.vy *= this.friction; 
                    this.x += this.vx; this.y += this.vy; 
                }
                draw() { 
                    ctx.fillStyle = this.color; 
                    ctx.shadowColor = this.color; 
                    ctx.shadowBlur = this.color === '#7701BC' ? 10 : 5; 
                    ctx.beginPath(); 
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
                    ctx.fill(); 
                }
            }
            
            function animate() { 
                ctx.clearRect(0, 0, canvas.width, canvas.height); 
                particles.forEach(p => { p.update(); p.draw(); }); 
                requestAnimationFrame(animate); 
            }
            
            resize(); 
            animate();
        })();

        // === АНИМАЦИЯ КУРСОРА-ПЕПЛА ===
        (function() {
            const canvas = document.getElementById('global-ash-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            resizeCanvas(); window.addEventListener('resize', resizeCanvas);
            let particles = []; 
            let fogTime = 0;
            
            class AshParticle {
                constructor(x, y) { 
                    this.x = x; this.y = y; 
                    this.vx = (Math.random() - 0.5) * 0.8; 
                    this.vy = -Math.random() * 0.5 - 0.2; 
                    this.life = 1; this.decay = 0.008 + Math.random() * 0.012; 
                    this.size = Math.random() * 3 + 1; 
                    this.color = Math.random() > 0.8 ? '#510FD5' : '#C1BFBF'; 
                }
                update() { 
                    this.x += this.vx; this.y += this.vy; this.vx *= 0.98; 
                    this.vy += 0.01; this.life -= this.decay; this.size *= 0.998; 
                }
                draw() { 
                    ctx.save(); ctx.globalAlpha = this.life * 0.8; ctx.fillStyle = this.color; 
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); 
                    ctx.restore(); 
                }
            }
            
            function drawFog() {
                const fogHeight = 120;
                const gradient = ctx.createLinearGradient(0, canvas.height, 0, canvas.height - fogHeight);
                gradient.addColorStop(0, `rgba(17, 17, 17, ${0.4 + Math.sin(fogTime) * 0.1})`);
                gradient.addColorStop(0.5, `rgba(17, 17, 17, 0.2)`);
                gradient.addColorStop(1, `rgba(17, 17, 17, 0)`);
                ctx.fillStyle = gradient; 
                ctx.fillRect(0, canvas.height - fogHeight, canvas.width, fogHeight);
                fogTime += 0.005;
            }
            
            function handleMouseMove(e) { 
                for (let i = 0; i < 6; i++) { 
                    particles.push(new AshParticle(e.clientX + (Math.random() - 0.5) * 30, e.clientY + (Math.random() - 0.5) * 30)); 
                } 
            }
            function handleTouchMove(e) { 
                if (e.touches[0]) { 
                    handleMouseMove({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY }); 
                } 
            }
            
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height); 
                drawFog();
                particles = particles.filter(p => { p.update(); p.draw(); return p.life > 0 && p.size > 0.1; });
                if (Math.random() < 0.03) { 
                    particles.push(new AshParticle(Math.random() * canvas.width, canvas.height + 10)); 
                }
                requestAnimationFrame(animate);
            }
            
            window.addEventListener('mousemove', handleMouseMove, { passive: true });
            window.addEventListener('touchmove', handleTouchMove, { passive: true });
            animate();
        })();
    </script>
