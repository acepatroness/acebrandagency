    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Определение языка из URL или установка по умолчанию
            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang') === 'ru' ? 'ru' : 'en';
            
            document.body.dataset.lang = lang;
            
            // Показываем контент для нужного языка
            const activeContent = document.querySelector(`.lang-${lang}`);
            activeContent.style.display = 'block';
            
            // Текст для анимации 404
            const errorTexts = {
                en: "404",
                ru: "404"
            };
            
            // SEO для русского языка
            if (lang === 'ru') {
                document.querySelector('title').textContent = '404 - Страница не найдена | ACE Brand Agency';
                document.querySelector('meta[name="description"]').setAttribute('content', 'Страница, которую вы ищете, не существует. Вернитесь в ACE Brand Agency.');
                document.querySelector('meta[property="og:title"]').setAttribute('content', '404 - Страница не найдена | ACE Brand Agency');
                document.querySelector('meta[property="og:description"]').setAttribute('content', 'Страница, которую вы ищете, не существует. Вернитесь во вселенную.');
            }
            
            // Анимация символов для 404
            function animate404() {
                const errorCodeEl = activeContent.querySelector('.error-code');
                const text = errorTexts[lang];
                errorCodeEl.innerHTML = '';
                
                let charIndex = 0;
                const initialDelay = 1.0;
                
                for (const char of text) {
                    const span = document.createElement('span');
                    span.className = 'char highlight';
                    span.innerHTML = char;
                    span.style.animationDelay = `${initialDelay + charIndex * 0.1}s`;
                    errorCodeEl.appendChild(span);
                    charIndex++;
                }
            }
            
            animate404();
        });
    </script>
